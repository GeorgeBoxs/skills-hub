# Weekly upstream sync: refreshes vendored skills per sources.lock and opens
# a review PR. Merging that PR is the release — consumer repos pick it up via
# marketplace auto-update.
#
# Requires repo setting Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests" (off by default);
# without it the PR step fails with "GitHub Actions is not permitted to create
# or approve pull requests".
#
# Note: with the default GITHUB_TOKEN, workflows do NOT trigger on the created
# PR. This repo has no CI, so that is fine; if CI is added later, switch to a
# fine-grained PAT (contents: write + pull-requests: write) via `token:`.
name: Sync upstream skills

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh vendored skills
        run: python3 scripts/sync_upstream.py

      # PR body = review checklist + SYNC_NOTES.md, so new upstream skills are
      # readable straight from the PR / notification. Written outside the
      # workspace so it is not committed.
      - name: Compose PR body
        run: |
          cat - SYNC_NOTES.md > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated weekly sync from pinned upstreams.

          - `sources.lock` diff shows the SHA bump per source.
          - The notes below list warnings (e.g. skills removed upstream) and new
            upstream skills that are not vendored yet — to take one, add its
            mapping to `sources.lock` and re-run `scripts/sync_upstream.py`.
          - Review the skill diffs: **merging this PR releases the changes
            to every consumer repo** via marketplace auto-update.

          EOF

      - name: Open review PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/upstream-skills
          delete-branch: true
          commit-message: "sync: refresh vendored upstream skills"
          title: "sync: refresh vendored upstream skills"
          body-path: ${{ runner.temp }}/pr-body.md
